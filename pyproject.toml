[project]
name = "dota2bets"
version = "0.1.0"
description = "Data foundation for Dota 2 pro-match modelling and betting-market research"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
dota2bets = "dota2bets.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dota2bets"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
