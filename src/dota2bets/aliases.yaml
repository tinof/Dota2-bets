# Pinnacle publishes short names; OpenDota stores registered ones. Matching is
# whitespace-collapsed and case-insensitive, and a trailing "(Kills)" is stripped
# before lookup, so only genuinely different words need to be listed as aliases.
#
# `name` must be the OpenDota name for the id (that is what `matches` stores).
# Add a team here the first time `dota2bets resolve` reports it as unresolved.
#
